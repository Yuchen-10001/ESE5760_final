// Validation target:
// K. Puttaswamy and G. H. Loh,
// "3D-Integrated SRAM Components for High-Performance Microprocessors",
// IEEE Transactions on Computers, 58(10), 2009.
//
// DESTINY Table 10 reference point:
//   Capacity: 2 MB
//   Layers:   4
//   Node:     65 nm
//   Actual latency: 4.88 ns
//   Actual energy:  0.12 nJ
//
// This cfg is intended as a validation starting point.
// It locks the public parameters that are explicit in the paper / DESTINY table,
// while keeping the remaining structural assumptions visible for later tuning.

-DesignTarget: cache

-CacheAccessMode: Normal
-Associativity (for cache only): 1

-ProcessNode: 65

-Capacity (MB): 2
-WordWidth (bit): 256

-DeviceRoadmap: LOP

-LocalWireType: LocalAggressive
-LocalWireRepeaterType: RepeatedNone
-LocalWireUseLowSwing: No

-GlobalWireType: GlobalAggressive
-GlobalWireRepeaterType: RepeatedNone
-GlobalWireUseLowSwing: No

-Routing: H-tree

-InternalSensing: true

-MemoryCellInputFile: sample_SRAM.cell

-Temperature (K): 350

// Validation runs are easier to compare when the output includes full detail.
-PrintLevel: 1

// Keep exploration mode on while the structural parameters are still being tuned.
// Once bank/mat layout is calibrated, this can be changed to a single fixed target.
-OptimizationTarget: Full
-EnablePruning: Yes

-BufferDesignOptimization: latency

// Public 3D parameters from the DESTINY validation point.
-StackedDieCount: 4
-PartitionGranularity: 1
-LocalTSVProjection: 0
-GlobalTSVProjection: 0
-TSVRedundancy: 1.0

// Optional TSV sensitivity knobs added in this project.
// Keep the original worst-case hop assumption for baseline reproduction.
-TSVHopModel: WorstCase
//-TSVHopModel: Average
//-TSVHopModel: Custom
//-TSVHopFactor: 0.5

// ------------------------------------------------------------------
// Calibration hooks
//
// DESTINY's SRAM validation in the paper uses a fixed cache dimension
// per cache size and then folds the 4-layer design relative to the
// 2-layer organization. The exact bank/mat geometry for the 2 MB case
// is not exposed in the paper text, so these are left commented until
// we derive them from further reconstruction work.
//
// Suggested next step:
// 1. run this cfg and record baseline latency / energy
// 2. force bank / mat / mux dimensions to move toward the 4.88 ns,
//    0.12 nJ validation target
//
//-ForceBank3D (Total AxBxC, Active DxE): 1x1x4, 1x1
//-ForceBank3DA (Total AxBxC): 1x1x4
//-ForceBank (Total AxB, Active CxD): 1x1, 1x1
//-ForceBankA (Total AxB): 1x1
//-ForceMat (Total AxB, Active CxD): 1x1, 1x1
//-ForceMatA (Total AxB): 1x1
//-ForceMuxSenseAmp: 128
//-ForceMuxOutputLev1: 1
//-ForceMuxOutputLev2: 1
