// 3D eDRAM at 45nm  [TSV baseline: Local=0 Global=0 Redundancy=1.0]
// ESE5760 Final Project — Normalized baseline
// 2MB | 256bit | Assoc=1 | LOP | 350K | WriteEDP | RetentionTime=40us

-DesignTarget: cache
-CacheAccessMode: Normal
-Associativity (for cache only): 1
-Capacity (MB): 2
-WordWidth (bit): 256
-DeviceRoadmap: LOP
-LocalWireType: LocalAggressive
-LocalWireRepeaterType: RepeatedNone
-LocalWireUseLowSwing: No
-GlobalWireType: GlobalAggressive
-GlobalWireRepeaterType: RepeatedNone
-GlobalWireUseLowSwing: No
-Routing: H-tree
-InternalSensing: true
-Temperature (K): 350
-OptimizationTarget: WriteEDP
-EnablePruning: Yes
-BufferDesignOptimization: latency
-ProcessNode: 45
-MemoryCellInputFile: config/sample_3D_eDRAM.cell
-StackedDieCount: 2
-PartitionGranularity: 0
-LocalTSVProjection: 0
-GlobalTSVProjection: 0
-TSVRedundancy: 1.0
-RetentionTime (us): 40
