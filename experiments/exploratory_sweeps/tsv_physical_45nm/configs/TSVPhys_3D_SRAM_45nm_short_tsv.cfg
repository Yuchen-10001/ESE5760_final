// TSV physical sweep — 3D SRAM @ 45nm (short_tsv)
// pitch_scale=1.0 diameter_scale=1.0 length_scale=0.7 contact_scale=1.0

-DesignTarget: cache
-CacheAccessMode: Normal
-Associativity (for cache only): 1
-Capacity (MB): 2
-WordWidth (bit): 256
-DeviceRoadmap: LOP
-LocalWireType: LocalAggressive
-LocalWireRepeaterType: RepeatedNone
-LocalWireUseLowSwing: No
-GlobalWireType: GlobalAggressive
-GlobalWireRepeaterType: RepeatedNone
-GlobalWireUseLowSwing: No
-Routing: H-tree
-InternalSensing: true
-Temperature (K): 350
-OptimizationTarget: WriteEDP
-EnablePruning: Yes
-BufferDesignOptimization: latency
-ProcessNode: 45
-MemoryCellInputFile: config/sample_SRAM.cell
-StackedDieCount: 2
-PartitionGranularity: 0
-LocalTSVProjection: 0
-GlobalTSVProjection: 0
-TSVRedundancy: 1.0
-TSVPitchScale: 1.0
-TSVDiameterScale: 1.0
-TSVLengthScale: 0.7
-TSVContactResistanceScale: 1.0
