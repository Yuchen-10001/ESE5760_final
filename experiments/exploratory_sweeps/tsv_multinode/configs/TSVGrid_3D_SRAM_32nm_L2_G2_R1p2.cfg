// TSV multinode sweep — 3D SRAM @ 32nm
// LocalTSVProjection=2  GlobalTSVProjection=2  TSVRedundancy=1.2
// ESE5760 Final Project — Fixed 3D SRAM baseline

-DesignTarget: cache
-CacheAccessMode: Normal
-Associativity (for cache only): 1
-Capacity (MB): 2
-WordWidth (bit): 256
-DeviceRoadmap: LOP
-LocalWireType: LocalAggressive
-LocalWireRepeaterType: RepeatedNone
-LocalWireUseLowSwing: No
-GlobalWireType: GlobalAggressive
-GlobalWireRepeaterType: RepeatedNone
-GlobalWireUseLowSwing: No
-Routing: H-tree
-InternalSensing: true
-Temperature (K): 350
-OptimizationTarget: WriteEDP
-EnablePruning: Yes
-BufferDesignOptimization: latency
-ProcessNode: 32
-MemoryCellInputFile: config/sample_SRAM.cell
-StackedDieCount: 2
-PartitionGranularity: 0
-LocalTSVProjection: 2
-GlobalTSVProjection: 2
-TSVRedundancy: 1.2
